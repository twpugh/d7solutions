{% extends "base.html" %}
{% block title %}{{ page.title }} | D7 Solutions{% endblock %}
{% block description %}{{ page.description }}{% endblock %}

{% block content %}
<div class="page-head">
  <div class="inner">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<section>
  <div class="prose">
    {{ page.body|safe }}
  </div>
</section>
{% endblock %}
